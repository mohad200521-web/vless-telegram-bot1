name: Run Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xray
        run: |
          mkdir -p "$HOME/xray/config"

          curl -L \
            "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" \
            -o /tmp/xray.zip

          unzip -o /tmp/xray.zip -d "$HOME/xray"

          chmod +x "$HOME/xray/xray"

          cp config.json "$HOME/xray/config/config.json"

          "$HOME/xray/xray" version

      - name: Test Xray
        run: |
          "$HOME/xray/xray" run -test \
            -config "$HOME/xray/config/config.json"

      - name: Start Xray
        run: |
          nohup "$HOME/xray/xray" run \
            -config "$HOME/xray/config/config.json" \
            > xray.log 2>&1 &

          sleep 5

          echo "===== XRAY LOG ====="
          cat xray.log

      - name: Start Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PUBLIC_HOST: "127.0.0.1"
          WS_PATH: "Télégram/@MOHAMaaaaal/@VLessVMessTroja"
          XRAY_BIN: "/home/runner/xray/xray"
          XRAY_API: "127.0.0.1:10085"
          CONFIG_PATH: "/home/runner/xray/config/config.json"
          INBOUND_TAG: "vless-in"
        run: |
          echo "Starting Telegram Bot..."
          python bot.py